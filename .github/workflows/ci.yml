name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux:
    name: Linux quality and browser
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
      - run: uv sync --locked --group dev --group browser
      - run: uv export --locked --no-dev --no-group browser --no-emit-project --format requirements-txt --output-file requirements.txt
      - run: git diff --exit-code -- requirements.txt
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync mypy src/bef_redbird
      - run: uv run --no-sync python scripts/check_repo_hygiene.py --tracked
      - run: uv run --no-sync pre-commit run --all-files --hook-stage pre-commit
      - run: uv run --no-sync pytest -m 'not browser and not private'
      - run: uv run --no-sync playwright install --with-deps chromium
      - run: uv run --no-sync pytest -m browser tests/browser --basetemp "${{ runner.temp }}/redbird-browser"
      # Only bounded synthetic browser images, never uploads, downloads or source data.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: synthetic-browser-failure
          path: ${{ runner.temp }}/redbird-browser/*/*.png
          if-no-files-found: ignore
          retention-days: 3
  windows:
    name: Windows synthetic smoke
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
      - run: uv sync --locked --group dev --group browser
      - run: uv run --no-sync python -c "import bef_redbird"
      - run: uv run --no-sync pytest -m 'not browser and not private'
      - run: uv run --no-sync python scripts/check_repo_hygiene.py --tracked
